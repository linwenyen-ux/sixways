<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="戰情籤">
<meta name="description" content="美股與台股六大策略每日戰情板，加上今日籤、抽籤與模擬倉">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>戰情籤</title>
<link rel="stylesheet" href="base.css">
<style>
/* ── 戰情籤新增的樣式；基底沿用兩個舊 App 共用的 base.css ── */
.mkseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:8px;vertical-align:middle}
.mkseg button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:3px 10px;cursor:pointer}
.mkseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar h1{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0}
.bar h1 em{flex-basis:100%}
.subtabs{display:flex;gap:6px;margin:0 2px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtabs .chip{white-space:nowrap}
.fortune{border-radius:16px;padding:18px 16px 14px;margin:4px 2px 12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.fortune::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.fortune.up::before{background:var(--good)}.fortune.down::before{background:var(--bad)}
.fortune.mid::before{background:var(--warn)}.fortune.odd::before{background:var(--accent2)}
.fortune .lv{font-size:12px;color:var(--muted);letter-spacing:.2em}
.fortune .nm{font-size:28px;font-weight:800;margin:2px 0 4px;letter-spacing:.04em}
.fortune.up .nm{color:var(--good)}.fortune.down .nm{color:var(--bad)}
.fortune.mid .nm{color:var(--warn)}.fortune.odd .nm{color:var(--accent2)}
.fortune .poem{font-size:15px;line-height:1.7;margin:4px 0 10px}
.fortune .meta{font-size:12px;color:var(--muted);line-height:1.6}
.fortune .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.flip{margin:0 2px 12px}
.disc{font-size:11.5px;color:var(--muted);text-align:center;margin:6px 2px 14px;line-height:1.6}
.drawcard{margin:0 2px 12px}
.setrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.setrow input,.setrow textarea{flex:1;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0}
.setrow textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.holdlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.holditem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.holditem .hid{font-weight:800;min-width:64px}.holditem .hnm{color:var(--muted);flex:1;font-size:12.5px}
.holditem .hcost{font-size:12px;color:var(--muted)}
.holditem .x{appearance:none;border:none;background:none;color:var(--bad);font-weight:800;font-size:16px;cursor:pointer;padding:0 4px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0 2px 10px}
h2 .sp{flex:1}
.brd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.brd b{color:var(--fg)}.brd.hot{border-color:var(--bad);color:var(--fg)}
.pill.hold{background:rgba(224,138,30,.16);color:var(--warn);border-color:rgba(224,138,30,.4)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;line-height:1.45;text-align:center;max-width:calc(100% - 28px);z-index:90;opacity:0;transition:opacity .2s,transform .22s cubic-bezier(.34,1.3,.64,1);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--good);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
/* 跟單／出場的回饋：按鈕變色定格一下＋震動＋下方「模擬倉」分頁彈一下，讓人看得出東西進了哪裡 */
.btn.ok{background:var(--good);border-color:var(--good);color:#fff;opacity:1}
.btn.warnb{background:var(--warn);border-color:var(--warn);color:#fff;opacity:1}
.btn.pop{animation:btnpop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes btnpop{0%{transform:scale(1)}32%{transform:scale(.9)}100%{transform:scale(1)}}
nav button.ping{color:var(--good)}
nav button.ping .ic{animation:navping .85s ease}
nav .bdg.ping{animation:bdgping .85s ease}
@keyframes navping{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-5px) scale(1.2)}62%{transform:translateY(0) scale(1)}}
@keyframes bdgping{0%{transform:translate(13px,-4px) scale(.3);opacity:.2}55%{transform:translate(13px,-4px) scale(1.55);opacity:1}100%{transform:translate(13px,-4px) scale(1)}}
@media (prefers-reduced-motion:reduce){.btn.pop,nav button.ping .ic,nav .bdg.ping{animation:none}}
.chkl{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.6}
.chkl li{padding:3px 0;border-bottom:1px dashed var(--line)}
.chkl li:last-child{border-bottom:none}
.chkl .y{color:var(--good)}.chkl .b{color:var(--accent)}.chkl .n{color:var(--muted)}
.empty.big{padding:40px 10px;text-align:center;color:var(--muted)}
.mrow .sym .code{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
/* 數值格裡的日期要自己一行；接在數字後面會把隔壁格擠掉（模擬倉「成交 110.39 2026-11-11」踩過） */
.stats .v .code{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:1px}
.fortune .lv{letter-spacing:.08em}

/* base.css 只擋 section[hidden]；.onb／.gmd 是 div 又自己設了 display:flex，
   class 規則的優先權高過瀏覽器預設的 [hidden]{display:none}，所以 hidden 屬性會完全失效
   ——導覽關掉後整頁被一層空白蓋住。這條補起來。 */
[hidden]{display:none!important}

/* ── 名詞解釋：有虛線底線的字可以點 ── */
.gl{border-bottom:1px dotted var(--accent);cursor:pointer;color:inherit}
.gmd{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.gmd .bd{position:absolute;inset:0;background:rgba(10,14,20,.45)}
.gmd .gcard{position:relative;width:100%;max-width:560px;max-height:78vh;display:flex;flex-direction:column;
background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);
animation:gup .22s cubic-bezier(.32,.72,0,1)}
@keyframes gup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.gmd .ghead{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.gmd .ghead b{font-size:15px;flex:1;min-width:0}
.gmd .gbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(env(safe-area-inset-bottom) + 18px);font-size:13.5px;line-height:1.75}
.gmd .gbody p{margin:0 0 10px}.gmd .gbody p:last-child{margin-bottom:0}
.gmd .gnum{font-variant-numeric:tabular-nums}
.gmd .gitem{padding:10px 0;border-bottom:1px dashed var(--line)}
.gmd .gitem:last-child{border-bottom:none}
.gmd .gitem>b{display:block;margin-bottom:1px;font-size:14px}
.gmd .gmore{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.glhint{font-size:12px;color:var(--muted);text-align:center;margin:0 2px 12px;line-height:1.6}

/* ── 首次啟動導覽 ── */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.onb .pgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.onb .op{display:none}.onb .op.on{display:block}
.onb .ic{font-size:38px;line-height:1}
.onb h3{font-size:21px;margin:10px 0 4px;letter-spacing:-.3px}
.onb .sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.7}
.onb .li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.7}
.onb .li:last-child{border-bottom:none}
.onb .li .e{flex:0 0 26px;font-size:17px;text-align:center;line-height:1.5}
.onb .li b{display:block}
.onb .box{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
background:var(--inset);font-size:12.5px;color:var(--muted);line-height:1.75}
.onb .box b{color:var(--fg)}
.onb .foot{display:flex;align-items:center;gap:8px;padding-top:14px}
.onb .dots{display:flex;gap:6px;flex:1;align-items:center}
.onb .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;transition:width .2s,background .2s}
.onb .dots i.on{background:var(--accent);width:18px;border-radius:999px}

/* ── 歷史籤 ── */
.hrow{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);
border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.hrow .hd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.hrow .hl{font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:999px;flex:0 0 auto}
.hrow .hl.up{background:rgba(46,158,91,.15);color:var(--good)}
.hrow .hl.down{background:rgba(217,75,75,.15);color:var(--bad)}
.hrow .hl.mid{background:rgba(224,138,30,.15);color:var(--warn)}
.hrow .hl.odd{background:rgba(123,83,198,.16);color:var(--accent2)}
.hrow .hn{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hx{color:var(--muted);font-size:12px;flex:0 0 auto}
.hdet{padding:2px 12px 12px;margin:-4px 0 8px;font-size:12.5px;line-height:1.75;color:var(--muted);
border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;background:var(--card)}
.hdet b{color:var(--fg)}
.hsum{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 2px 10px;
padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.hsum b{color:var(--fg)}
</style>
</head>
<body>
<header class="bar">
  <h1>戰情籤
    <span class="mkseg" id="mkseg">
      <button type="button" data-mk="us" aria-pressed="true">美股</button><button type="button" data-mk="tw" aria-pressed="false">台股</button>
    </span>
    <em id="hd-sub">載入中…</em>
  </h1>
  <button class="ibtn" id="btnTheme" type="button" aria-label="切換主題">◐</button>
  <button class="ibtn" id="btnReload" type="button" aria-label="重新載入">&#8635;</button>
</header>

<main>
  <section id="pg-home"></section>
  <section id="pg-board" hidden>
    <div class="subtabs" id="subtabs">
      <button class="chip" data-sub="mkt">大盤</button>
      <button class="chip" data-sub="watch">觀察</button>
      <button class="chip" data-sub="pool">全池</button>
      <button class="chip" data-sub="cci">CCI</button>
    </div>
    <div id="board-body"></div>
  </section>
  <section id="pg-draw" hidden></section>
  <section id="pg-paper" hidden></section>
  <section id="pg-settings" hidden></section>
</main>

<nav>
  <button type="button" data-tab="home" aria-current="page"><span class="ic">&#127808;</span><span class="tx">今日籤</span></button>
  <button type="button" data-tab="board"><span class="ic">&#128202;</span><span class="tx">戰情板</span></button>
  <button type="button" data-tab="paper"><span class="ic">&#128203;</span><span class="tx">模擬倉</span></button>
  <button type="button" data-tab="settings"><span class="ic">&#9881;</span><span class="tx">設定</span></button>
</nav>

<div class="sheet" id="sheet-d" role="dialog" aria-modal="true" aria-label="詳情">
  <div class="shead"><button class="ibtn" id="dClose" type="button" aria-label="返回">&#8592;</button><div class="ttl" id="dTtl"></div></div>
  <div class="sbody" id="dBody"></div>
</div>
<div class="gmd" id="gmodal" hidden><div class="bd" id="gbd"></div>
  <div class="gcard" role="dialog" aria-modal="true" aria-labelledby="gTtl">
    <div class="ghead"><b id="gTtl"></b><button class="ibtn" id="gClose" type="button" aria-label="關閉">&times;</button></div>
    <div class="gbody" id="gBody"></div>
  </div></div>
<div class="onb" id="onb" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ 工具 ═══════════ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(v,d){if(v==null||isNaN(v))return '—';return Number(v).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function sgn(v,d){if(v==null||isNaN(v))return '—';return (v>0?'+':'')+Number(v).toFixed(d==null?2:d)}
function cl(v){return v>0?'pos':(v<0?'neg':'flat')}
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m,kind){var t=$('#toast');t.textContent=m;t.className='toast on'+(kind?' '+kind:'');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},kind?2400:1800)}
/* 震動：Android Chrome 有 Vibration API；iOS Safari 沒有，那邊只會看到按鈕變色＋分頁彈動 */
function buzz(p){if(!S.buzz)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
/* 下方「模擬倉」分頁彈一下（徽章是 render() 建的，所以要在 render 之後才叫） */
function pingPaper(){
  var nb=$('nav button[data-tab="paper"]');if(!nb)return;
  function off(){nb.classList.remove('ping');var b=nb.querySelector('.bdg');if(b)b.classList.remove('ping')}
  off();void nb.offsetWidth;
  nb.classList.add('ping');var bd=nb.querySelector('.bdg');if(bd)bd.classList.add('ping');
  clearTimeout(pingPaper._t);pingPaper._t=setTimeout(off,900);
}

/* ═══════════ 狀態 ═══════════ */
var S={
  mkt: LS.get('sx.mkt','us'),
  tab: LS.get('sx.tab','home'),
  sub: LS.get('sx.sub','mkt'),
  D:{}, CX:{}, PX:{}, WX:{},
  hold: LS.get('sx.hold',{us:[],tw:[]}),        /* 我的持股：只存在這支手機 */
  wx:   LS.get('sx.wx',{us:[],tw:[]}),          /* 自己加的觀察標的 */
  paper:LS.get('sx.paper',{us:[],tw:[]}),       /* 模擬倉：同上，不上雲 */
  psub: LS.get('sx.psub','open'),
  pf:{side:'all',age:'all',scope:'all',q:''},
  cf:{v:'act',scope:'all',q:''},
  buzz: LS.get('sx.buzz',true),                 /* 震動回饋，可在設定頁關掉 */
  hist: LS.get('sx.hist',{us:[],tw:[]}),        /* 歷史籤：每個訊號日一筆，同樣只存這支手機 */
  glseen:LS.get('sx.glseen',false),             /* 點過任一個名詞解釋了沒 */
  histAll:false, histOpen:null,
  flip:false, drawn:null
};
function M(){return S.D[S.mkt]||null}
function holdIds(){return (S.hold[S.mkt]||[]).map(function(h){return h.id})}
function isHold(id){return holdIds().indexOf(id)>=0}
function holdOf(id){return (S.hold[S.mkt]||[]).filter(function(h){return h.id===id})[0]||null}
function watchIds(){var m=M();if(!m)return [];var a=(m.watch||[]).map(function(w){return w.id});(S.wx[S.mkt]||[]).forEach(function(i){if(a.indexOf(i)<0)a.push(i)});return a}
function isWatch(id){return watchIds().indexOf(id)>=0}
function cciOf(id){return (S.CX[S.mkt]||{})[id]||null}
function poolRows(){return (M()||{}).pool||[]}
function nameOf(id){var m=M();if(!m)return id;var c=cciOf(id);if(c&&c.nm)return c.nm;var w=(S.WX[S.mkt]||{})[id];if(w&&w.nm)return w.nm;var p=(S.PX[S.mkt]||{})[id];if(p&&p.nm)return p.nm;return id}
function showNm(id){var n=nameOf(id);return n&&n!==id?(S.mkt==='tw'?esc(n)+' <span class="code">'+esc(id)+'</span>':esc(id)):esc(id)}

/* ═══════════ 資料 ═══════════ */
function index(m){
  var cx={},px={},wx={};
  ((m.cci||{}).rows||[]).forEach(function(r){cx[r.id]=r});
  (m.pool||[]).forEach(function(r){if(!px[r.id])px[r.id]=r});
  (m.watch||[]).forEach(function(r){wx[r.id]=r});
  return {cx:cx,px:px,wx:wx};
}
function load(mk,force){
  if(S.D[mk]&&!force)return Promise.resolve(S.D[mk]);
  return fetch('data/'+mk+'.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(j){S.D[mk]=j;var ix=index(j);S.CX[mk]=ix.cx;S.PX[mk]=ix.px;S.WX[mk]=ix.wx;return j});
}
function fetchHeavy(id){return fetch('d/'+S.mkt+'/'+encodeURIComponent(id)+'.json').then(function(r){return r.ok?r.json():null}).catch(function(){return null})}

/* ═══════════ 導覽 ═══════════ */
function go(tab){
  S.tab=tab;LS.set('sx.tab',tab);
  $$('main > section').forEach(function(s){s.hidden=s.id!=='pg-'+tab});
  $$('nav button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  window.scrollTo(0,0);render();
}
function goSub(sub){S.sub=sub;LS.set('sx.sub',sub);render()}
function setMkt(mk){S.mkt=mk;LS.set('sx.mkt',mk);S.flip=false;S.drawn=null;
  $$('#mkseg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mk===mk))});
  load(mk).then(render).catch(function(e){$('#hd-sub').textContent='資料載入失敗：'+e.message})}
$$('nav button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.tab)})});
$$('#mkseg button').forEach(function(b){b.addEventListener('click',function(){setMkt(b.dataset.mk)})});
$('#subtabs').addEventListener('click',function(e){var b=e.target.closest('[data-sub]');if(b)goSub(b.dataset.sub)});
$('#btnReload').addEventListener('click',function(){load(S.mkt,true).then(function(){toast('已更新');render()})});
$('#btnTheme').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme');var n=c==='dark'?'light':(c==='light'?'':'dark');if(n)r.setAttribute('data-theme',n);else r.removeAttribute('data-theme');LS.set('sx.theme',n)});
(function(){var t=LS.get('sx.theme','');if(t)document.documentElement.setAttribute('data-theme',t)})();

/* ═══════════ 共用片段 ═══════════ */
function kv(k,v){return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function kvc(k,v,c){return '<div><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>'}
function dim6(dm){var ab=['趨','位','K','均','量','指'],o='<span class="dim6">';for(var i=0;i<6;i++){o+='<i class="'+(dm||'nnnnnn')[i]+'">'+ab[i]+'</i>'}return o+'</span>'}
function grcls(r){return r>=1?'r4':(r>=.8?'r3':(r>=.5?'r2':'r1'))}
function scls(st,rg){if(rg)return 'range';return st==='多頭'?'bull':(st==='空頭'?'bear':'range')}
function badges(id){var o='';if(isHold(id))o+='<span class="pill hold">持股</span>';if(isWatch(id))o+='<span class="pill">★</span>';return o}
/* CCI 格：剛觸發的那一側先標出來，再接活的那側（兩者互斥，死叉當天活的是進場價） */
function cciCells(id){
  var x=cciOf(id);if(!x)return '';var P='';
  if(x.k==='g'&&x.entk==='hit')P+=kvc('今日金叉',fmt(x.ent),'pos');
  else if(x.k==='d'&&x.slk==='hit')P+=kvc('今日死叉',fmt(x.sl),'neg');
  if(x.entk==='fwd')P+=kvc('進場價',fmt(x.ent),'pos');else if(x.slk==='fwd')P+=kvc('止損價',fmt(x.sl),'neg');
  if(!P)return '';return P+kvc('距門檻',sgn(x.gap)+'%',cl(x.gap));
}
function cciCard(id){
  var x=cciOf(id),m=M();
  if(!x)return '<div class="card"><div class="bhead"><span class="h">CCI 門檻</span></div><div class="mnote" style="border:none;padding:6px 0 0;margin:0">距下一根穿越門檻超過 '+((m.cci||{}).meta||{}).band+'%，未收錄。</div></div>';
  var k={g:'今日金叉',d:'今日死叉',n:'尚未穿越・待'+(x.want||'')}[x.k];
  function px(v,kd){return v==null?'—':fmt(v)+(kd==='hit'?'（今日已觸發）':'')}
  var h=holdOf(id),pnl='';
  if(h&&h.cost>0&&x.c)pnl=kvc('依我的成本',sgn((x.c/h.cost-1)*100)+'%',cl(x.c/h.cost-1));
  return '<div class="card"><div class="bhead"><span class="h">'+gl('cci','CCI')+' 門檻</span><span class="sp"></span><span class="pill'+(x.k==='g'?' long':(x.k==='d'?' short':''))+'">'+gl('cross',esc(k))+'</span>'+(x.pine?'<span class="cfb">'+gl('pine','✓三條件')+'</span>':'')+'</div>'
    +'<div class="kv">'+kv(gl('ent','進場價')+'（觸發金叉）',px(x.ent,x.entk))+kv(gl('slp','止損價')+'（觸發死叉）',px(x.sl,x.slk))+kv(gl('gap','距門檻'),sgn(x.gap)+'%')+kv(gl('cci_a','CCI_A'),fmt(x.a,1))+kv(gl('sma','均線 SMA'),fmt(x.sma,1))+kv(gl('cci_b','CCI_B'),fmt(x.b,1))+pnl+'</div>'
    +'<div class="mnote" style="border:none;padding:6px 0 0;margin:0">兩者互斥，每根只有一側是「活的」。這是<b>收盤價門檻</b>不是盤中停損單——明日收盤跌破才觸發死叉、後日開盤才出場；門檻每天重算會移動。</div></div>';
}
function chkList(items){if(!items||!items.length)return '';return '<ul class="chkl">'+items.map(function(w){var c={'✓':'y','⊙':'b'}[String(w)[0]]||'n';return '<li class="'+c+'">'+esc(w)+'</li>'}).join('')+'</ul>'}
function turnPill(o){if(!o||!o.s)return '';var c={'轉多':'long','轉空':'short','分歧':'mix'}[o.s]||'cont';return '<span class="pill '+c+(o.e?' ev':'')+'">'+esc(o.k||o.s)+'</span>'}

function glVars(){
  var m=M()||{},mt=m.meta||{},cm=(m.cci||{}).meta||{},b=m.breadth||{},st=(m.cci||{}).stats||{};
  return {mk:m.label||'',th:mt.cci_th,cut:b.cut,per:b.per_year,hotd:b.hot_days,hotavg:sgn(b.hot_avg),
          act:cm.act,band:cm.band,la:cm.len_a,lb:cm.len_b,sml:cm.sma_len,fee:mt.fee_rate,
          pf:st.pf,dpf:(st.day||{}).pf,bm:BMNM[S.mkt]};
}
function glFill(t){var v=glVars();return String(t).replace(/\{(\w+)\}/g,function(_,k){return v[k]==null?'—':v[k]})}
/* 可點的名詞：label 省略時用詞條自己的標題 */

/* ═══════════ 歷史籤 ═══════════
   只能從安裝之後開始累積：每天的判讀只存在當天那份資料裡，過去的沒有留存，無法回填。 */
function hists(){return S.hist[S.mkt]||(S.hist[S.mkt]=[])}
function recHist(){
  var m=M();if(!m||!m.date)return;
  var h=hists();
  if(h.some(function(x){return x.date===m.date}))return;
  var f=fortune(m),r=m.regime||{},b=m.breadth||{},c=(m.cci||{}).counts||{};
  h.push({date:m.date,lv:f.lv,nm:f.nm,cls:f.cls,poem:f.poem,why:f.why,
          st:r.state||'',sc:r.score,bn:b.n==null?null:b.n,act:c.act||0});
  h.sort(function(a,z){return a.date<z.date?-1:(a.date>z.date?1:0)});
  if(h.length>120)S.hist[S.mkt]=h.slice(-120);
  LS.set('sx.hist',S.hist);
}
function histBlock(){
  var m=M(),h=hists().slice().filter(function(x){return x.date!==(m||{}).date}).reverse();
  if(!h.length)return '<h2>歷史籤</h2><div class="hint">歷史籤從今天開始累積，只存在這支手機。明天再打開，就會在這裡看到今天這支籤。<br>（過去的籤無法回填——每天的判讀只在當天的資料裡，沒有留存。）</div>';
  var cnt={};h.forEach(function(x){cnt[x.lv]=(cnt[x.lv]||0)+1});
  var sum='<div class="hsum"><span>已記錄 <b>'+h.length+'</b> 天</span>'+['上籤','中籤','下籤','奇籤'].map(function(k){return cnt[k]?'<span>'+k+' <b>'+cnt[k]+'</b></span>':''}).join('')+'<span>最早 '+h[h.length-1].date+'</span></div>';
  var show=S.histAll?h:h.slice(0,7);
  var rows=show.map(function(x){

/* ═══════════ 戰情板：CCI ═══════════ */
function cciMatch(x){var f=S.cf,m=(M().cci||{}).meta||{};
  var g=Math.abs(x.gap||0);
  if(f.v==='act'&&!((x.k==='g'&&x.pine)||(x.k==='d'&&isHold(x.id))||g<=(m.act||1)))return false;
  if(f.v==='g'&&x.k!=='g')return false;if(f.v==='d'&&x.k!=='d')return false;
  if(f.v==='near'&&!(x.k==='n'&&g<=(m.near||2)))return false;
  if(f.scope==='hold'&&!isHold(x.id))return false;
  if(f.scope==='watch'&&!isWatch(x.id))return false;
  if(f.q&&(String(x.id)+' '+String(x.nm||'')).toLowerCase().indexOf(f.q)<0)return false;
  return true}
function cciRow(x){
  var st=x.k==='g'?'<span class="pill long">金叉</span>':(x.k==='d'?'<span class="pill short">死叉</span>':'<span class="pill age">待'+esc(x.want||'')+'</span>');
  function cpx(l,v,kd,c){if(v==null)return '';return '<span class="'+c+'">'+l+' '+fmt(v)+(kd==='hit'?' 已':'')+'</span> '}
  return '<div class="prow crow2" data-open="'+esc(x.id)+'" role="button" tabindex="0"><span class="c1">'+st+'</span><span class="c2"><span class="t1"><span class="sym">'+showNm(x.id)+'</span>'+badges(x.id)+(x.etf?'<span class="pill">ETF</span>':'')+(x.pine?'<span class="cfb">✓三條件</span>':'')+'</span><span class="t2">'+cpx('進',x.ent,x.entk,'pos')+cpx('損',x.sl,x.slk,'neg')+'<span class="cmini">CCI_A '+fmt(x.a,1)+' / SMA '+fmt(x.sma,1)+'</span></span></span><span class="c3"><span class="px">'+fmt(x.c)+'</span><br><span class="dv '+cl(x.gap)+'">'+sgn(x.gap)+'%</span></span></div>';
}

  P.push('<div class="fbar qbar"><div class="seg">'+chip('v','act','可動作')+chip('v','all','全部')+chip('v','g','金叉 '+(C.g||0))+chip('v','d','死叉 '+(C.d||0))+chip('v','near','明日預警 '+(C.near||0))+'</div><span class="cnt">'+rows.length+' / '+all.length+' 筆</span></div>');
  P.push('<div class="fbar qbar"><div class="seg">'+chip('scope','all','全池')+chip('scope','hold','只看持股 '+nh+(xh?'・出場提醒 '+xh:''))+chip('scope','watch','只看觀察')+'</div></div>');
  P.push('<div class="setrow" style="margin:0 2px 8px"><input id="cq" type="search" placeholder="搜尋代號或名稱…" value="'+esc(f.q)+'"></div>');
  P.push('<div class="plist">'+(rows.length?rows.map(cciRow).join(''):'<div class="empty">沒有符合條件的標的</div>')+'</div>');
  var st=cc.stats||{},dy=st.day||{},mt=cc.meta||{};

}

    P.push('<div class="drawcard">'+(w?watchCard(w):'<div class="card" data-open="'+esc(S.drawn)+'" role="button"><div class="whead"><span class="wsym">'+showNm(S.drawn)+badges(S.drawn)+'</span></div><div class="wprice">'+fmt(x.c)+'</div><div class="stats">'+kvc('距月線',sgn(x.dev)+'%',cl(x.dev))+(p?kv('位階',fmt(p.p))+kv('量比',fmt(p.v)):'')+'</div>'+(p?'<div class="tags">'+dim6(p.dm)+' <span class="pill '+(p.side==='多'?'long':'short')+'">'+esc(p.s)+' '+esc(p.side)+'</span></div>':'')+'</div>')+cciCard(S.drawn)+'</div>');
    P.push('<div class="acts" style="margin:0 2px 10px">'+pBtn(S.drawn)+'</div>')}
  P.push('<div class="disc">規則判定結果，不構成投資建議。</div>');
  $('#pg-draw').innerHTML=P.join('');
  $('#btnDo').addEventListener('click',function(){if(!pool.length){toast('今天沒有可動作的標的');return}var pick=pool[Math.floor(Math.random()*pool.length)];S.drawn=pick.id;renderDraw();window.scrollTo(0,0)});
  var o=$('#btnOpen');if(o)o.addEventListener('click',function(){openDetail(S.drawn)});
}

/* ═══════════ 模擬倉 ═══════════
   規則貼著回測：成交價一律是「下一個交易日開盤」，成本照各市場來回費率，每筆等權。
   成交怎麼來：今天跟單只記下當下的訊號日；明天排程產出新的 payload，裡面帶的就是
   明天的開盤價 —— settle() 用它把「待成交」補成實際成交。出場同理。
   所以「待成交」不是 bug，是忠實反映「訊號出來的當下你還買不到」。            */
var BM={us:'SPY',tw:'^TWII'},BMNM={us:'SPY',tw:'加權指數'};
function papers(){return S.paper[S.mkt]||(S.paper[S.mkt]=[])}
function savePaper(){LS.set('sx.paper',S.paper)}
function feeRate(){return ((M()||{}).meta||{}).fee_rate||0}
function pStat(t){return !t.fill?'pending':(!t.exitSig?'open':(!t.exit?'closing':'closed'))}
function openTrade(id){var a=papers().filter(function(t){return t.id===id&&pStat(t)!=='closed'});return a[0]||null}
function lastPx(id){var x=cciOf(id);if(x&&x.c!=null)return x.c;var p=(S.PX[S.mkt]||{})[id];if(p&&p.c!=null)return p.c;var w=(S.WX[S.mkt]||{})[id];return w&&w.c!=null?w.c:null}
function pRet(t){if(!t.fill||!t.exit)return null;return (t.exit/t.fill-1)*100-feeRate()}
function pUnreal(t){var c=lastPx(t.id);if(!t.fill||c==null)return null;return (c/t.fill-1)*100-feeRate()}
function pBm(t){if(t.bmIn&&t.bmOut)return (t.bmOut/t.bmIn-1)*100;return null}
/* 成交結算：只在「payload 的訊號日已經晚於跟單／出場那天」且該檔有開盤價時才成交 */
function settle(){
  var m=M();if(!m)return 0;var o=m.opens||{},bm=o[BM[S.mkt]],n=0;
  papers().forEach(function(t){
    if(!t.fill&&m.date>t.sig&&o[t.id]!=null){t.fill=o[t.id];t.fillDate=m.date;if(bm)t.bmIn=bm;n++}
    if(t.fill&&t.exitSig&&!t.exit&&m.date>t.exitSig&&o[t.id]!=null){t.exit=o[t.id];t.exitDate=m.date;if(bm)t.bmOut=bm;n++}
  });
  if(n)savePaper();return n;
}
/* 按鈕按下後先變色定格 ACK 毫秒再重畫；不然 render() 會立刻把按鈕換成「出場」，看起來像沒反應 */
var ACK=620;
function ack(btn,cls,txt,id){
  function done(){
    render();pingPaper();
    var da=$('#dacts');                       /* 詳情頁開著的話，它的按鈕也要換回正常狀態 */
    if(da&&$('#sheet-d').classList.contains('open'))da.innerHTML=pBtn(id);
  }
  if(!btn){done();return}
  btn.classList.add(cls,'pop');btn.textContent=txt;btn.disabled=true;
  setTimeout(done,ACK);
}
function follow(id,btn){
  var m=M();if(!m)return;
  if(openTrade(id)){buzz(28);toast('這一檔已經在模擬倉裡','warn');return}
  var x=cciOf(id),p=(S.PX[S.mkt]||{})[id];
  papers().push({id:id,nm:nameOf(id),sig:m.date,why:(x&&x.k==='g'?'CCI 金叉':(p&&p.s?p.s+' '+p.side:'手動跟單')),
    sigPx:lastPx(id),fill:null,fillDate:null,exitSig:null,exit:null,exitDate:null,bmIn:null,bmOut:null});
  savePaper();buzz([18,45,22]);
  toast('✓ '+id+' 已進模擬倉・下一個交易日開盤成交','ok');
  ack(btn,'ok','✓ 已進模擬倉',id);
}
function askExit(id,btn){
  var m=M(),t=openTrade(id);if(!t)return;
  if(pStat(t)==='pending'){if(!confirm('這筆還沒成交，取消跟單？'))return;
    S.paper[S.mkt]=papers().filter(function(z){return z!==t});savePaper();buzz(28);
    toast('已取消跟單，'+id+' 不在模擬倉了','bad');render();return}
  if(pStat(t)==='closing'){buzz(28);toast('已排定出場，下一個交易日開盤成交','warn');return}
  t.exitSig=m.date;savePaper();buzz([18,45,22]);
  toast('✓ '+id+' 已排定出場・下一個交易日開盤成交','warn');
  ack(btn,'warnb','✓ 已排定出場',id);
}
function pBtn(id){
  var t=openTrade(id),x=cciOf(id),st=t?pStat(t):null;
  if(!t)return '<button class="btn pri" data-follow="'+esc(id)+'" type="button">跟單</button>';
  if(st==='pending')return '<button class="btn" data-exit="'+esc(id)+'" type="button">待成交・取消跟單</button>';
  if(st==='closing')return '<button class="btn" disabled type="button">已排定出場</button>';
  var die=x&&x.k==='d';
  return '<button class="btn'+(die?' pri':'')+'" data-exit="'+esc(id)+'" type="button">'+(die?'死叉・建議出場':'出場')+'</button>';
}
function pStats(list){
  var r=list.map(pRet).filter(function(v){return v!=null});
  if(!r.length)return null;
  var pos=r.filter(function(v){return v>0}),neg=r.filter(function(v){return v<0});
  var s=r.slice().sort(function(a,b){return a-b});
  var gp=pos.reduce(function(a,b){return a+b},0),gl=Math.abs(neg.reduce(function(a,b){return a+b},0));
  return {n:r.length,win:100*pos.length/r.length,avg:r.reduce(function(a,b){return a+b},0)/r.length,
          med:s[Math.floor(s.length/2)],pf:gl?gp/gl:null};
}
function pRow(t){
  var st=pStat(t),u=st==='open'||st==='closing'?pUnreal(t):null,r=pRet(t),bm=pBm(t);
  var tag={pending:'<span class="pill age">'+gl('pending','待成交')+'</span>',open:'<span class="pill long">持倉中</span>',
           closing:'<span class="pill age">待出場成交</span>',closed:'<span class="pill cont">已平倉</span>'}[st];
  var v=r!=null?r:u, val=v==null?'—':sgn(v)+'%';
  return '<div class="card"><div class="whead"><span class="wsym">'+showNm(t.id)+'</span>'+tag+'<span class="wsp"></span><span class="wchg '+cl(v)+'" style="font-size:17px;font-weight:800">'+val+'</span></div>'
    +'<div class="stats">'+kv('跟單日',esc(t.sig))+(t.fill?kv('成交',fmt(t.fill)+' <span class="code">'+esc(t.fillDate)+'</span>'):kv('成交',gl('fill','下一個交易日開盤')))
    +(t.exit?kv('出場',fmt(t.exit)+' <span class="code">'+esc(t.exitDate)+'</span>'):(st==='closing'?kv('出場','下一個交易日開盤'):(t.fill?kv('現價',fmt(lastPx(t.id))):'')))
    +(bm!=null?kvc(gl('bm','同期'+BMNM[S.mkt]),sgn(bm)+'%',cl(bm)):'')+'</div>'
    +'<div class="tags"><span class="pill">'+esc(t.why)+'</span>'+(r!=null&&bm!=null?'<span class="pill '+(r>bm?'long':'short')+'">'+(r>bm?'贏大盤':'輸大盤')+' '+sgn(r-bm)+'%</span>':'')+'</div>'
    +'<div class="acts" style="margin-top:10px">'+(st==='closed'?'<button class="btn danger" data-del="'+esc(t.id)+'|'+esc(t.sig)+'" type="button">刪除紀錄</button>':pBtn(t.id))+'<button class="btn" data-open="'+esc(t.id)+'" type="button">看詳情</button></div></div>';
}
function renderPaper(){
  var m=M(),all=papers(),open=all.filter(function(t){return pStat(t)!=='closed'}),closed=all.filter(function(t){return pStat(t)==='closed'});
  var P=[],sub=S.psub;
  var st=pStats(closed),die=open.filter(function(t){return pStat(t)==='open'&&(cciOf(t.id)||{}).k==='d'});
  P.push('<div class="subtabs">'+[['open','持倉中 '+open.length],['closed','已平倉 '+closed.length],['perf','績效']].map(function(a){return '<button class="chip" data-psub="'+a[0]+'" aria-pressed="'+(sub===a[0])+'">'+a[1]+'</button>'}).join('')+'</div>');
  if(die.length&&sub!=='perf')P.push('<div class="brd hot"><span class="pill short">建議出場</span>'+die.length+' 檔已出現 CCI 死叉：'+die.map(function(t){return esc(nameOf(t.id))}).join('、')+'</div>');
  if(sub==='open'){
    P.push(open.length?open.map(pRow).join(''):'<div class="empty big">還沒有部位。<br><br>到「戰情板」或「抽籤」點開任一檔，按「跟單」。</div>');
  }else if(sub==='closed'){
    P.push(closed.length?closed.slice().reverse().map(pRow).join(''):'<div class="empty big">還沒有已平倉的紀錄。</div>');
  }else{
    if(!st){P.push('<div class="empty big">還沒有已平倉的交易，算不出績效。</div>')}
    else{
      var bms=closed.map(pBm).filter(function(v){return v!=null});
      var bavg=bms.length?bms.reduce(function(a,b){return a+b},0)/bms.length:null;
      P.push('<h2>已平倉 '+st.n+' 筆</h2><div class="stats">'+kvc('勝率',st.win.toFixed(1)+'%','')+kvc('平均',sgn(st.avg)+'%',cl(st.avg))+kvc('中位',sgn(st.med)+'%',cl(st.med))+kvc(gl('pf','獲利因子'),st.pf==null?'—':st.pf.toFixed(2),st.pf>=1?'pos':'neg')+(bavg!=null?kvc(gl('bm','同期'+BMNM[S.mkt]+'平均'),sgn(bavg)+'%',cl(bavg)):'')+'</div>');
      var cc=(m.cci||{}).stats||{},dy=cc.day||{};
      if(dy.pf)P.push('<div class="card"><div class="bhead"><span class="h">對照：CCI 策略回測</span></div><div class="stats">'+kv(gl('dayweight','以訊號日計'),fmt(dy.n,0)+' 天')+kv('勝率',dy.win+'%')+kv('中位',sgn(dy.med)+'%')+kv(gl('pf','獲利因子'),dy.pf)+'</div><div class="mnote" style="border:none;padding:6px 0 0;margin:0">你的樣本數還很小時，和這組數字差很多是正常的。回測本身也顯示：<b>平常中位數為負，正期望值來自少數幾次全市場底部</b>。</div></div>');
      P.push('<div class="hint">成交價一律用<b>'+gl('fill','下一個交易日開盤')+'</b>、每筆等權、已扣'+gl('fee','來回成本')+' '+feeRate()+'%，與戰情板的回測同一套規則，所以兩邊數字可以直接對照。不計滑價、不計跳空、不計部位大小。</div>');
    }
  }
  P.push('<div class="disc">模擬倉不是真實交易，全部存在這支手機。用途是練習紀律：訊號出來有沒有跟、出場訊號出來有沒有走。</div>');
  var el=$('#pg-paper');el.innerHTML=P.join('');
  $$('[data-psub]',el).forEach(function(b){b.addEventListener('click',function(){S.psub=b.dataset.psub;LS.set('sx.psub',S.psub);renderPaper()})});
  $$('[data-del]',el).forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.del.split('|');S.paper[S.mkt]=papers().filter(function(t){return !(t.id===a[0]&&t.sig===a[1])});savePaper();renderPaper()})});
}

  P.push('<div class="holdlist">'+(W.length?W.map(function(i){return '<div class="holditem"><span class="hid">'+esc(i)+'</span><span class="hnm">'+esc(nameOf(i)!==i?nameOf(i):'')+'</span><button class="x" data-rmw="'+esc(i)+'" type="button" aria-label="移除">×</button></div>'}).join(''):'<div class="empty">尚未加入</div>')+'</div>');

  P.push('<div class="setrow"><button class="btn'+(S.buzz?' pri':'')+'" id="bzz" type="button">震動回饋：'+(S.buzz?'開':'關')+'</button></div>');

var stack=[];
function openSheet(ttl,body){$('#dTtl').innerHTML=ttl;$('#dBody').innerHTML=body;$('#sheet-d').classList.add('open');$('#dBody').scrollTop=0;stack.push(1);try{history.pushState({s:stack.length},'')}catch(e){}}

function openDetail(id,ri){
  var m=M(),w=(S.WX[S.mkt]||{})[id],p=(S.PX[S.mkt]||{})[id],x=cciOf(id),ix=(m.index||[]).filter(function(z){return z.id===id})[0];
  var src=w||p||ix||x;if(!src){toast('沒有這一檔的資料');return}
  var B=[];
  if(w||ix){var c=scls(src.state,src.ranging);B.push('<div class="card '+c+'"><div class="whead"><span class="mstate '+c+'">'+esc(src.state||'')+'</span><span class="wsp"></span>'+(w&&w.hit!=null?'<span class="gr '+grcls(w.hit/(w.tot||6))+'">'+w.hit+'/'+(w.tot||6)+'</span>':'')+'</div><div class="mnote" style="border:none;padding:0;margin:0">'+esc(src.basis||src.note||src.ma_txt||'')+'</div></div>')}
  if(w&&w.why&&w.why.length)B.push('<div class="card"><div class="bhead"><span class="h">'+gl('dim6','六面向檢核')+'</span><span class="sp"></span><span class="pill">'+w.hit+'／'+(w.tot||6)+' 項成立</span></div>'+chkList(w.why)+'</div>');
  var st=src;B.push('<div class="card"><div class="kv">'+kv('收盤',fmt(st.c))+(st.chg!=null?kv('當日',sgn(st.chg)+'%'):'')+(st.ma20!=null?kv('月線',fmt(st.ma20)):'')+(st.dev!=null?kv(gl('dev','距月線'),sgn(st.dev)+'%'):'')+(st.p!=null?kv(gl('pos','位階')+'（52 週）',fmt(st.p)):'')+(st.v!=null?kv(gl('vr','量比'),fmt(st.v)):'')+(st.ma_align?kv(gl('align','均線排列'),esc(st.ma_align)):'')+(st.ret20!=null?kv('近 20 日報酬',sgn(st.ret20)+'%'):'')+(st.rs20!=null?kv(gl('rs','相對大盤'),sgn(st.rs20)+'%'):'')+(st.resist!=null?kv('壓力線',fmt(st.resist)):'')+(st.support!=null?kv('支撐線',fmt(st.support)):'')+(p&&p.s?kv('策略',esc(p.s)+' '+esc(p.side)+(p.age===0?'（今日）':'（'+p.age+' 日前）')):'')+'</div></div>');
  B.push(cciCard(id));
  if(p)B.push('<div id="hv"><div class="load">載入逐項判定…</div></div>');
  if(w&&(w.kdt||w.mct))B.push('<div class="card"><div class="bhead"><span class="h">'+gl('kdmacd','KD／MACD 轉向')+'</span><span class="sp"></span>'+turnPill(w.kdt)+turnPill(w.mct)+'</div></div>');
  B.unshift('<div class="acts" id="dacts" style="margin:0 2px 10px">'+pBtn(id)+'</div>');
  openSheet('<span class="sym">'+showNm(id)+'</span>'+(src.chg!=null?' <span class="wchg '+cl(src.chg)+'">'+sgn(src.chg)+'%</span>':'')+badges(id),B.join(''));
  if(p){fetchHeavy(id).then(function(j){var el=$('#hv');if(!el)return;var h=j&&(j[String(ri!=null?ri:p._i)]||j[Object.keys(j)[0]]);if(!h){el.innerHTML='<div class="load">⚠️ 沒有對應的詳情資料</div>';return}
    var items=h.why||(h.chk?String(h.chk).split('|'):[]);var P=[];
    if(items.length)P.push('<div class="card"><div class="bhead"><span class="h">'+gl('dim6','六面向逐項判定')+'</span></div>'+chkList(items)+'</div>');
    if(h.kdt||h.mct)P.push('<div class="card"><div class="bhead"><span class="h">KD／MACD</span></div><div class="fb" style="padding:0">'+esc(h.kdt||'')+(h.kdt&&h.mct?'<br>':'')+esc(h.mct||'')+'</div></div>');
    if(h.ent){var e=[];for(var k in h.ent)if(h.ent[k])e.push(esc(h.ent[k]));if(e.length)P.push('<div class="card"><div class="bhead"><span class="h">確認進場</span></div><div class="fb" style="padding:0">'+e.join('<br>')+'</div></div>')}
    if(h.wk&&h.wk.w)P.push('<div class="card"><div class="bhead"><span class="h">週線底部反轉</span></div><div class="fb" style="padding:0">'+esc(h.wk.w)+'</div></div>');
    el.innerHTML=P.join('')||''})}
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-gl]');if(g){openGloss(g.dataset.gl);return}   /* 要排在開詳情之前 */
  var f=e.target.closest('[data-follow]');if(f){follow(f.dataset.follow,f);return}
  var x=e.target.closest('[data-exit]');if(x){askExit(x.dataset.exit,x);return}
  var ob=e.target.closest('button[data-open]');if(ob){closeSheet();stack.length=0;openDetail(ob.dataset.open);return}
  var el=e.target.closest('[data-open]');if(!el||e.target.closest('button,input,a'))return;
  openDetail(el.dataset.open,el.dataset.ri!=null?+el.dataset.ri:null)});

/* ═══════════ 總渲染 ═══════════ */
function render(){
  settle();recHist();
  var m=M();$('#hd-sub').textContent=m?('訊號日 '+m.date+' ・ 產生 '+m.generated):'載入中…';
  var nOpen=papers().filter(function(t){return pStat(t)!=='closed'}).length;
  var nb=$('nav button[data-tab="paper"]');
  var bd=nb.querySelector('.bdg');if(nb){if(nOpen){if(!bd){bd=document.createElement('span');bd.className='bdg';nb.appendChild(bd)}bd.textContent=nOpen}else if(bd)bd.remove()}
  ({home:renderHome,board:renderBoard,draw:renderDraw,paper:renderPaper,settings:renderSettings}[S.tab]||renderHome)();
}
$$('#mkseg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mk===S.mkt))});
$$('main > section').forEach(function(s){s.hidden=s.id!=='pg-'+S.tab});
$$('nav button').forEach(function(b){if(b.dataset.tab===S.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
load(S.mkt).then(render).catch(function(e){$('#hd-sub').textContent='資料載入失敗：'+e.message;$('#pg-home').innerHTML='<div class="empty big">讀不到 data/'+S.mkt+'.json</div>'});
load(S.mkt==='us'?'tw':'us').catch(function(){});   /* 另一個市場預先抓，切換不等待 */
if(LS.get('sx.onb',0)<ONB_V)showOnb();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
