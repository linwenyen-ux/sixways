<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="戰情籤">
<meta name="description" content="美股與台股六大策略每日戰情板，加上今日籤、抽籤與模擬倉">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>戰情籤</title>
<link rel="stylesheet" href="base.css">
<style>
/* ── 戰情籤新增的樣式；基底沿用兩個舊 App 共用的 base.css ── */
.mkseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:8px;vertical-align:middle}
.mkseg button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:3px 10px;cursor:pointer}
.mkseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar h1{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0}
.bar h1 em{flex-basis:100%}
.subtabs{display:flex;gap:6px;margin:0 2px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtabs .chip{white-space:nowrap}
.fortune{border-radius:16px;padding:18px 16px 14px;margin:4px 2px 12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.fortune::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.fortune.up::before{background:var(--good)}.fortune.down::before{background:var(--bad)}
.fortune.mid::before{background:var(--warn)}.fortune.odd::before{background:var(--accent2)}
.fortune .lv{font-size:12px;color:var(--muted);letter-spacing:.2em}
.fortune .nm{font-size:28px;font-weight:800;margin:2px 0 4px;letter-spacing:.04em}
.fortune.up .nm{color:var(--good)}.fortune.down .nm{color:var(--bad)}
.fortune.mid .nm{color:var(--warn)}.fortune.odd .nm{color:var(--accent2)}
.fortune .poem{font-size:15px;line-height:1.7;margin:4px 0 10px}
.fortune .meta{font-size:12px;color:var(--muted);line-height:1.6}
.fortune .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.flip{margin:0 2px 12px}
.disc{font-size:11.5px;color:var(--muted);text-align:center;margin:6px 2px 14px;line-height:1.6}
.drawcard{margin:0 2px 12px}
.setrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.setrow input,.setrow textarea{flex:1;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0}
.setrow textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.holdlist{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.holditem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.holditem .hid{font-weight:800;min-width:64px}.holditem .hnm{color:var(--muted);flex:1;font-size:12.5px}
.holditem .hcost{font-size:12px;color:var(--muted)}
.holditem .x{appearance:none;border:none;background:none;color:var(--bad);font-weight:800;font-size:16px;cursor:pointer;padding:0 4px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0 2px 10px}
h2 .sp{flex:1}
.brd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.brd b{color:var(--fg)}.brd.hot{border-color:var(--bad);color:var(--fg)}
.pill.hold{background:rgba(224,138,30,.16);color:var(--warn);border-color:rgba(224,138,30,.4)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;line-height:1.45;text-align:center;max-width:calc(100% - 28px);z-index:70;opacity:0;transition:opacity .2s,transform .22s cubic-bezier(.34,1.3,.64,1);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--good);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
.toast.bad{background:var(--bad);color:#fff}
/* 跟單／出場的回饋：按鈕變色定格一下＋震動＋下方「模擬倉」分頁彈一下，讓人看得出東西進了哪裡 */
.btn.ok{background:var(--good);border-color:var(--good);color:#fff;opacity:1}
.btn.warnb{background:var(--warn);border-color:var(--warn);color:#fff;opacity:1}
.btn.pop{animation:btnpop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes btnpop{0%{transform:scale(1)}32%{transform:scale(.9)}100%{transform:scale(1)}}
nav button.ping{color:var(--good)}
nav button.ping .ic{animation:navping .85s ease}
nav .bdg.ping{animation:bdgping .85s ease}
@keyframes navping{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-5px) scale(1.2)}62%{transform:translateY(0) scale(1)}}
@keyframes bdgping{0%{transform:translate(13px,-4px) scale(.3);opacity:.2}55%{transform:translate(13px,-4px) scale(1.55);opacity:1}100%{transform:translate(13px,-4px) scale(1)}}
@media (prefers-reduced-motion:reduce){.btn.pop,nav button.ping .ic,nav .bdg.ping{animation:none}}
.chkl{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.6}
.chkl li{padding:3px 0;border-bottom:1px dashed var(--line)}
.chkl li:last-child{border-bottom:none}
.chkl .y{color:var(--good)}.chkl .b{color:var(--accent)}.chkl .n{color:var(--muted)}
.empty.big{padding:40px 10px;text-align:center;color:var(--muted)}
.mrow .sym .code{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
/* 數值格裡的日期要自己一行；接在數字後面會把隔壁格擠掉（模擬倉「成交 110.39 2026-11-11」踩過） */
.stats .v .code{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:1px}
.fortune .lv{letter-spacing:.08em}
</style>
</head>
<body>
<header class="bar">
  <h1>戰情籤
    <span class="mkseg" id="mkseg">
      <button type="button" data-mk="us" aria-pressed="true">美股</button><button type="button" data-mk="tw" aria-pressed="false">台股</button>
    </span>
    <em id="hd-sub">載入中…</em>
  </h1>
  <button class="ibtn" id="btnTheme" type="button" aria-label="切換主題">◐</button>
  <button class="ibtn" id="btnReload" type="button" aria-label="重新載入">&#8635;</button>
</header>

<main>
  <section id="pg-home"></section>
  <section id="pg-board" hidden>
    <div class="subtabs" id="subtabs">
      <button class="chip" data-sub="mkt">大盤</button>
      <button class="chip" data-sub="watch">觀察</button>
      <button class="chip" data-sub="pool">全池</button>
      <button class="chip" data-sub="cci">CCI</button>
    </div>
    <div id="board-body"></div>
  </section>
  <section id="pg-draw" hidden></section>
  <section id="pg-paper" hidden></section>
  <section id="pg-settings" hidden></section>
</main>

<nav>
  <button type="button" data-tab="home" aria-current="page"><span class="ic">&#127808;</span><span class="tx">今日籤</span></button>
  <button type="button" data-tab="board"><span class="ic">&#128202;</span><span class="tx">戰情板</span></button>
  <button type="button" data-tab="paper"><span class="ic">&#128203;</span><span class="tx">模擬倉</span></button>
  <button type="button" data-tab="settings"><span class="ic">&#9881;</span><span class="tx">設定</span></button>
</nav>

<div class="sheet" id="sheet-d" role="dialog" aria-modal="true" aria-label="詳情">
  <div class="shead"><button class="ibtn" id="dClose" type="button" aria-label="返回">&#8592;</button><div class="ttl" id="dTtl"></div></div>
  <div class="sbody" id="dBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ 工具 ═══════════ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(v,d){if(v==null||isNaN(v))return '—';return Number(v).toLocaleString('en-US',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})}
function sgn(v,d){if(v==null||isNaN(v))return '—';return (v>0?'+':'')+Number(v).toFixed(d==null?2:d)}
function cl(v){return v>0?'pos':(v<0?'neg':'flat')}
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m,kind){var t=$('#toast');t.textContent=m;t.className='toast on'+(kind?' '+kind:'');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},kind?2400:1800)}
/* 震動：Android Chrome 有 Vibration API；iOS Safari 沒有，那邊只會看到按鈕變色＋分頁彈動 */
function buzz(p){if(!S.buzz)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
/* 下方「模擬倉」分頁彈一下（徽章是 render() 建的，所以要在 render 之後才叫） */
function pingPaper(){
  var nb=$('nav button[data-tab="paper"]');if(!nb)return;
  function off(){nb.classList.remove('ping');var b=nb.querySelector('.bdg');if(b)b.classList.remove('ping')}
  off();void nb.offsetWidth;
  nb.classList.add('ping');var bd=nb.querySelector('.bdg');if(bd)bd.classList.add('ping');
  clearTimeout(pingPaper._t);pingPaper._t=setTimeout(off,900);
}

/* ═══════════ 狀態 ═══════════ */
var S={
  mkt: LS.get('sx.mkt','us'),
  tab: LS.get('sx.tab','home'),
  sub: LS.get('sx.sub','mkt'),
  D:{}, CX:{}, PX:{}, WX:{},
  hold: LS.get('sx.hold',{us:[],tw:[]}),        /* 我的持股：只存在這支手機 */
  wx:   LS.get('sx.wx',{us:[],tw:[]}),          /* 自己加的觀察標的 */
  paper:LS.get('sx.paper',{us:[],tw:[]}),       /* 模擬倉：同上，不上雲 */
  psub: LS.get('sx.psub','open'),
  pf:{side:'all',age:'all',scope:'all',q:''},
  cf:{v:'act',scope:'all',q:''},
  buzz: LS.get('sx.buzz',true),                 /* 震動回饋，可在設定頁關掉 */
  flip:false, drawn:null
};
function M(){return S.D[S.mkt]||null}
function holdIds(){return (S.hold[S.mkt]||[]).map(function(h){return h.id})}
function isHold(id){return holdIds().indexOf(id)>=0}
function holdOf(id){return (S.hold[S.mkt]||[]).filter(function(h){return h.id===id})[0]||null}
function watchIds(){var m=M();if(!m)return [];var a=(m.watch||[]).map(function(w){return w.id});(S.wx[S.mkt]||[]).forEach(function(i){if(a.indexOf(i)<0)a.push(i)});return a}
function isWatch(id){return watchIds().indexOf(id)>=0}
function cciOf(id){return (S.CX[S.mkt]||{})[id]||null}
function poolRows(){return (M()||{}).pool||[]}
function nameOf(id){var m=M();if(!m)return id;var c=cciOf(id);if(c&&c.nm)return c.nm;var w=(S.WX[S.mkt]||{})[id];if(w&&w.nm)return w.nm;var p=(S.PX[S.mkt]||{})[id];if(p&&p.nm)return p.nm;return id}
function showNm(id){var n=nameOf(id);return n&&n!==id?(S.mkt==='tw'?esc(n)+' <span class="code">'+esc(id)+'</span>':esc(id)):esc(id)}

/* ═══════════ 資料 ═══════════ */
function index(m){
  var cx={},px={},wx={};
  ((m.cci||{}).rows||[]).forEach(function(r){cx[r.id]=r});
  (m.pool||[]).forEach(function(r){if(!px[r.id])px[r.id]=r});
  (m.watch||[]).forEach(function(r){wx[r.id]=r});
  return {cx:cx,px:px,wx:wx};
}
function load(mk,force){
  if(S.D[mk]&&!force)return Promise.resolve(S.D[mk]);
  return fetch('data/'+mk+'.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(j){S.D[mk]=j;var ix=index(j);S.CX[mk]=ix.cx;S.PX[mk]=ix.px;S.WX[mk]=ix.wx;return j});
}
function fetchHeavy(id){return fetch('d/'+S.mkt+'/'+encodeURIComponent(id)+'.json').then(function(r){return r.ok?r.json():null}).catch(function(){return null})}

/* ═══════════ 導覽 ═══════════ */
function go(tab){
  S.tab=tab;LS.set('sx.tab',tab);
  $$('main > section').forEach(function(s){s.hidden=s.id!=='pg-'+tab});
  $$('nav button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  window.scrollTo(0,0);render();
}
function goSub(sub){S.sub=sub;LS.set('sx.sub',sub);render()}
function setMkt(mk){S.mkt=mk;LS.set('sx.mkt',mk);S.flip=false;S.drawn=null;
  $$('#mkseg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mk===mk))});
  load(mk).then(render).catch(function(e){$('#hd-sub').textContent='資料載入失敗：'+e.message})}
$$('nav button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.tab)})});
$$('#mkseg button').forEach(function(b){b.addEventListener('click',function(){setMkt(b.dataset.mk)})});
$('#subtabs').addEventListener('click',function(e){var b=e.target.closest('[data-sub]');if(b)goSub(b.dataset.sub)});
$('#btnReload').addEventListener('click',function(){load(S.mkt,true).then(function(){toast('已更新');render()})});
$('#btnTheme').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme');var n=c==='dark'?'light':(c==='light'?'':'dark');if(n)r.setAttribute('data-theme',n);else r.removeAttribute('data-theme');LS.set('sx.theme',n)});
(function(){var t=LS.get('sx.theme','');if(t)document.documentElement.setAttribute('data-theme',t)})();

/* ═══════════ 共用片段 ═══════════ */
function kv(k,v){return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function kvc(k,v,c){return '<div><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>'}
function dim6(dm){var ab=['趨','位','K','均','量','指'],o='<span class="dim6">';for(var i=0;i<6;i++){o+='<i class="'+(dm||'nnnnnn')[i]+'">'+ab[i]+'</i>'}return o+'</span>'}
function grcls(r){return r>=1?'r4':(r>=.8?'r3':(r>=.5?'r2':'r1'))}
function scls(st,rg){if(rg)return 'range';return st==='多頭'?'bull':(st==='空頭'?'bear':'range')}
function badges(id){var o='';if(isHold(id))o+='<span class="pill hold">持股</span>';if(isWatch(id))o+='<span class="pill">★</span>';return o}
/* CCI 格：剛觸發的那一側先標出來，再接活的那側（兩者互斥，死叉當天活的是進場價） */
function cciCells(id){
  var x=cciOf(id);if(!x)return '';var P='';
  if(x.k==='g'&&x.entk==='hit')P+=kvc('今日金叉',fmt(x.ent),'pos');
  else if(x.k==='d'&&x.slk==='hit')P+=kvc('今日死叉',fmt(x.sl),'neg');
  if(x.entk==='fwd')P+=kvc('進場價',fmt(x.ent),'pos');else if(x.slk==='fwd')P+=kvc('止損價',fmt(x.sl),'neg');
  if(!P)return '';return P+kvc('距門檻',sgn(x.gap)+'%',cl(x.gap));
}
function cciCard(id){
  var x=cciOf(id),m=M();
  if(!x)return '<div class="card"><div class="bhead"><span class="h">CCI 門檻</span></div><div class="mnote" style="border:none;padding:6px 0 0;margin:0">距下一根穿越門檻超過 '+((m.cci||{}).meta||{}).band+'%，未收錄。</div></div>';
  var k={g:'今日金叉',d:'今日死叉',n:'尚未穿越・待'+(x.want||'')}[x.k];
  function px(v,kd){return v==null?'—':fmt(v)+(kd==='hit'?'（今日已觸發）':'')}
  var h=holdOf(id),pnl='';
  if(h&&h.cost>0&&x.c)pnl=kvc('依我的成本',sgn((x.c/h.cost-1)*100)+'%',cl(x.c/h.cost-1));
  return '<div class="card"><div class="bhead"><span class="h">CCI 門檻</span><span class="sp"></span><span class="pill'+(x.k==='g'?' long':(x.k==='d'?' short':''))+'">'+esc(k)+'</span>'+(x.pine?'<span class="cfb">✓三條件</span>':'')+'</div>'
    +'<div class="kv">'+kv('進場價（觸發金叉）',px(x.ent,x.entk))+kv('止損價（觸發死叉）',px(x.sl,x.slk))+kv('距門檻',sgn(x.gap)+'%')+kv('CCI_A',fmt(x.a,1))+kv('均線 SMA',fmt(x.sma,1))+kv('CCI_B',fmt(x.b,1))+pnl+'</div>'
    +'<div class="mnote" style="border:none;padding:6px 0 0;margin:0">兩者互斥，每根只有一側是「活的」。這是<b>收盤價門檻</b>不是盤中停損單——明日收盤跌破才觸發死叉、後日開盤才出場；門檻每天重算會移動。</div></div>';
}
function chkList(items){if(!items||!items.length)return '';return '<ul class="chkl">'+items.map(function(w){var c={'✓':'y','⊙':'b'}[String(w)[0]]||'n';return '<li class="'+c+'">'+esc(w)+'</li>'}).join('')+'</ul>'}
function turnPill(o){if(!o||!o.s)return '';var c={'轉多':'long','轉空':'short','分歧':'mix'}[o.s]||'cont';return '<span class="pill '+c+(o.e?' ev':'')+'">'+esc(o.k||o.s)+'</span>'}

/* ═══════════ 今日籤 ═══════════ */
function fortune(m){
  var r=m.regime||{},b=m.breadth||{},st=String(r.state||''),g=(r.gate||{})['多'];
  if(b.hot)return {lv:'奇籤',nm:'全市場超賣',cls:'odd',poem:'滿城皆跌，此時反是。',why:'通過三條件的金叉 '+b.n+' 檔，越過門檻 ≥'+b.cut+' 檔——歷史上只出現 '+b.hot_days+' 次（年約 '+b.per_year+' 次）。那些日子的交易平均 '+sgn(b.hot_avg)+'%。'};
  if(/多方格局/.test(st)&&g==='順勢')return {lv:'上籤',nm:'順勢可攻',cls:'up',poem:'風往哪邊吹，帆就往哪邊掃。',why:'大盤'+st+'，多方訊號順勢。'};
  if(/空方格局/.test(st))return {lv:'下籤',nm:'逆風慎行',cls:'down',poem:'逆風不是不能走，是每一步都要算。',why:'大盤'+st+'，多方訊號逆勢。'};
  return {lv:'中籤',nm:'宜守觀望',cls:'mid',poem:'雲未開，先把船繫好。',why:'大盤'+(st||'方向不明')+'，不是明確的順勢環境。'};
}
function renderHome(){
  var m=M();if(!m){$('#pg-home').innerHTML='<div class="empty big">載入中…</div>';return}
  var f=fortune(m),r=m.regime||{},b=m.breadth||{},c=(m.cci||{}).counts||{};
  var P=['<div class="fortune '+f.cls+'"><div class="lv">'+esc(m.label)+' ・ 訊號日 '+esc(m.date)+' ・ '+f.lv+'</div><div class="nm">'+f.nm+'</div><div class="poem">'+f.poem+'</div>'

/* ═══════════ 模擬倉 ═══════════
   規則貼著回測：成交價一律是「下一個交易日開盤」，成本照各市場來回費率，每筆等權。
   成交怎麼來：今天跟單只記下當下的訊號日；明天排程產出新的 payload，裡面帶的就是
   明天的開盤價 —— settle() 用它把「待成交」補成實際成交。出場同理。
   所以「待成交」不是 bug，是忠實反映「訊號出來的當下你還買不到」。            */
var BM={us:'SPY',tw:'^TWII'},BMNM={us:'SPY',tw:'加權指數'};
function papers(){return S.paper[S.mkt]||(S.paper[S.mkt]=[])}
function savePaper(){LS.set('sx.paper',S.paper)}
function feeRate(){return ((M()||{}).meta||{}).fee_rate||0}
function pStat(t){return !t.fill?'pending':(!t.exitSig?'open':(!t.exit?'closing':'closed'))}
function openTrade(id){var a=papers().filter(function(t){return t.id===id&&pStat(t)!=='closed'});return a[0]||null}
function lastPx(id){var x=cciOf(id);if(x&&x.c!=null)return x.c;var p=(S.PX[S.mkt]||{})[id];if(p&&p.c!=null)return p.c;var w=(S.WX[S.mkt]||{})[id];return w&&w.c!=null?w.c:null}
function pRet(t){if(!t.fill||!t.exit)return null;return (t.exit/t.fill-1)*100-feeRate()}
function pUnreal(t){var c=lastPx(t.id);if(!t.fill||c==null)return null;return (c/t.fill-1)*100-feeRate()}
function pBm(t){if(t.bmIn&&t.bmOut)return (t.bmOut/t.bmIn-1)*100;return null}
/* 成交結算：只在「payload 的訊號日已經晚於跟單／出場那天」且該檔有開盤價時才成交 */
function settle(){
  var m=M();if(!m)return 0;var o=m.opens||{},bm=o[BM[S.mkt]],n=0;
  papers().forEach(function(t){
    if(!t.fill&&m.date>t.sig&&o[t.id]!=null){t.fill=o[t.id];t.fillDate=m.date;if(bm)t.bmIn=bm;n++}
    if(t.fill&&t.exitSig&&!t.exit&&m.date>t.exitSig&&o[t.id]!=null){t.exit=o[t.id];t.exitDate=m.date;if(bm)t.bmOut=bm;n++}
  });

}
/* 按鈕按下後先變色定格 ACK 毫秒再重畫；不然 render() 會立刻把按鈕換成「出場」，看起來像沒反應 */
var ACK=620;
function ack(btn,cls,txt,id){
  function done(){
    render();pingPaper();

    if(da&&$('#sheet-d').classList.contains('open'))da.innerHTML=pBtn(id);
  }
  if(!btn){done();return}
  btn.classList.add(cls,'pop');btn.textContent=txt;btn.disabled=true;
  setTimeout(done,ACK);
}
function follow(id,btn){

  papers().push({id:id,nm:nameOf(id),sig:m.date,why:(x&&x.k==='g'?'CCI 金叉':(p&&p.s?p.s+' '+p.side:'手動跟單')),
    sigPx:lastPx(id),fill:null,fillDate:null,exitSig:null,exit:null,exitDate:null,bmIn:null,bmOut:null});
  savePaper();buzz([18,45,22]);
  toast('✓ '+id+' 已進模擬倉・下一個交易日開盤成交','ok');
  ack(btn,'ok','✓ 已進模擬倉',id);
}
function askExit(id,btn){
  var m=M(),t=openTrade(id);if(!t)return;
  if(pStat(t)==='pending'){if(!confirm('這筆還沒成交，取消跟單？'))return;
    S.paper[S.mkt]=papers().filter(function(z){return z!==t});savePaper();buzz(28);
    toast('已取消跟單，'+id+' 不在模擬倉了','bad');render();return}
  if(pStat(t)==='closing'){buzz(28);toast('已排定出場，下一個交易日開盤成交','warn');return}
  t.exitSig=m.date;savePaper();buzz([18,45,22]);

function pBtn(id){
  var t=openTrade(id),x=cciOf(id),st=t?pStat(t):null;
  if(!t)return '<button class="btn pri" data-follow="'+esc(id)+'" type="button">跟單</button>';
  if(st==='pending')return '<button class="btn" data-exit="'+esc(id)+'" type="button">待成交・取消跟單</button>';
  if(st==='closing')return '<button class="btn" disabled type="button">已排定出場</button>';
  var die=x&&x.k==='d';
  return '<button class="btn'+(die?' pri':'')+'" data-exit="'+esc(id)+'" type="button">'+(die?'死叉・建議出場':'出場')+'</button>';
}
function pStats(list){
  var r=list.map(pRet).filter(function(v){return v!=null});
  if(!r.length)return null;
  var pos=r.filter(function(v){return v>0}),neg=r.filter(function(v){return v<0});
  var s=r.slice().sort(function(a,b){return a-b});
  var gp=pos.reduce(function(a,b){return a+b},0),gl=Math.abs(neg.reduce(function(a,b){return a+b},0));
  return {n:r.length,win:100*pos.length/r.length,avg:r.reduce(function(a,b){return a+b},0)/r.length,
          med:s[Math.floor(s.length/2)],pf:gl?gp/gl:null};
}
function pRow(t){

    +(bm!=null?kvc('同期'+BMNM[S.mkt],sgn(bm)+'%',cl(bm)):'')+'</div>'

    +'<div class="acts" style="margin-top:10px">'+(st==='closed'?'<button class="btn danger" data-del="'+esc(t.id)+'|'+esc(t.sig)+'" type="button">刪除紀錄</button>':pBtn(t.id))+'<button class="btn" data-open="'+esc(t.id)+'" type="button">看詳情</button></div></div>';
}
function renderPaper(){
  var m=M(),all=papers(),open=all.filter(function(t){return pStat(t)!=='closed'}),closed=all.filter(function(t){return pStat(t)==='closed'});

    }

  var el=$('#pg-paper');el.innerHTML=P.join('');
